<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Game Night — play with friends</title>
  <meta name="description" content="Free multiplayer party games you can play with friends in your browser: drawing, cards, pool, chess, arcade and more. Make a room, share the link, play.">
  <meta name="theme-color" content="#303F9F">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Game Night">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta property="og:title" content="Game Night">
  <meta property="og:description" content="Pick a game, make a room, send the link. Multiplayer games in your browser — no installs, no accounts.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
  <link rel="preload" href="assets/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // paint the right theme on the very first frame (full logic lives in js/theme.js)
    (function () { try { var p = localStorage.getItem('gn.theme'); var dark = p === 'night' || ((p === 'system' || !p) && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.dataset.theme = dark ? 'dark' : 'light'; if (dark) { document.querySelector('meta[name="theme-color"]').content = '#1A237E'; document.querySelector('meta[name="color-scheme"]').content = 'dark'; } } catch (e) {} })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="toasts"></div>
  <noscript><p style="padding:2rem">Game Night needs JavaScript to run.</p></noscript>
  <script src="js/config.js"></script>
  <script src="vendor/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
