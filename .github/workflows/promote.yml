# Promotes a version to STABLE (the site root of https://squattersnights.fun). Run it from the Actions tab — or `gh workflow run promote.yml`.
#   • Default: promotes the current main (what you have been testing on Nightly, at /nightly/).
#   • Roll back: run it again with an older release tag, e.g. ref = prod-20261009.0412-ab12cd3.
# The same checks run again, Stable is built and published, then the pipeline waits until the live site really serves the
# new build. If that never happens the previous Stable is restored. Nightly (the /nightly/ folder) is never touched.
name: Promote to Stable
run-name: Promote ${{ inputs.ref }} to Stable

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to release (default: main). To roll back, enter an older prod-… tag.'
        required: true
        default: main

# Stable and Nightly publishes write to the same Pages branch, so they take turns.
concurrency:
  group: site-publish
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

env:
  PROD_URL: https://squattersnights.fun
  PROD_CNAME: squattersnights.fun

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://squattersnights.fun
    steps:
      # the publishing tools always come from main; the version being released is checked out next to them
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          path: release

      - name: Check this version can be built
        run: test -f release/scripts/build.mjs || { echo "This ref predates the release pipeline — pick a newer one." >&2; exit 1; }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release/package-lock.json

      - run: npm ci
        working-directory: release

      - name: Install the test browser
        run: npx playwright install --with-deps chromium
        working-directory: release

      - name: Run the checks
        run: npm test
        working-directory: release

      - name: Build Stable
        working-directory: release
        run: |
          # versions from before the Stable/Nightly split call this environment "prod" too, so this works for rollbacks
          node scripts/build.mjs --env prod --cname "$PROD_CNAME" --out dist

      - name: Remember what is live now (for automatic rollback)
        id: prev
        run: |
          git fetch origin prod:refs/remotes/origin/prod 2>/dev/null || true
          echo "sha=$(git rev-parse -q --verify refs/remotes/origin/prod || true)" >> "$GITHUB_OUTPUT"

      - name: Publish Stable (the site root; /nightly/ is left exactly as it is)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh root release/dist "stable build $(jq -r .build release/dist/build.json) (source ${GITHUB_SHA::7})"

      - name: Wait until squattersnights.fun is serving this build
        run: |
          BUILD=$(jq -r .build release/dist/build.json)
          for i in $(seq 1 60); do
            LIVE=$(curl -fsS "$PROD_URL/build.json?t=$RANDOM" 2>/dev/null | jq -r .build 2>/dev/null || true)
            echo "attempt $i: live=$LIVE want=$BUILD"
            [ "$LIVE" = "$BUILD" ] && { echo "✔ Stable is live: $PROD_URL"; exit 0; }
            sleep 10
          done
          echo "Stable did not pick up the new build in 10 minutes" >&2
          exit 1

      - name: Tag this release
        working-directory: release
        run: |
          BUILD=$(jq -r .build dist/build.json)
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${{ github.token }}" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$AUTH" tag -f "prod-live" HEAD
          git -c "http.https://github.com/.extraheader=$AUTH" push -f origin "refs/tags/prod-live"
          if ! git ls-remote --exit-code --tags origin "refs/tags/prod-$BUILD" >/dev/null 2>&1; then
            git tag "prod-$BUILD" HEAD
            git -c "http.https://github.com/.extraheader=$AUTH" push origin "refs/tags/prod-$BUILD"
          fi

      - name: Restore the previous Stable (the release failed)
        if: failure() && steps.prev.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git worktree add /tmp/previous "${{ steps.prev.outputs.sha }}"
          scripts/publish.sh restore-root /tmp/previous "restore previous stable"
          echo "Previous Stable restored." >&2
